name: 이미지개선편 그림 만들기 (나노바나나)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/image-prompts.json'
  workflow_dispatch:
    inputs:
      slug:
        description: '회차 폴더 (예: 2026-11-28-img). 비우면 그림이 필요한 모든 회차'
        required: false
      force:
        description: '그 회차 그림을 전부 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: nano-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow·구글 인증 설치
        run: pip install pillow google-auth requests

      - name: 그림 만들기
        env:
          # 구글 클라우드(Vertex AI, 크레딧 사용): GCP_SA_KEY 또는 VERTEX_API_KEY
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # 예전 AI Studio 방식 (settings image_backend = ai_studio 일 때만 씀)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEN_REPORT: ${{ runner.temp }}/new_slugs.txt
        run: |
          ARGS="${{ github.event.inputs.slug }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # 토큰 절약: 이번 push에서 바뀐 회차만 그린다
            ARGS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -E '^docs/[^/]+/image-prompts.json$' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [ -z "$ARGS" ]; then echo "바뀐 회차 없음"; exit 0; fi
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/gen_images.py $ARGS

      - name: 그림 저장 (커밋)
        id: commit
        if: always()
        run: |
          git config user.name "raerae-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/*/img docs/assets/stock
          if [ -f config/image_usage.json ]; then git add config/image_usage.json; fi
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "이미지개선편 그림 생성 (나노바나나)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 웹페이지 다시 빌드 요청
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: 디스코드로 링크 보내기 (토큰이 있을 때만)
        if: steps.commit.outputs.changed == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ ! -f "${{ runner.temp }}/new_slugs.txt" ]; then exit 0; fi
          while read -r slug; do python scripts/discord_bot.py link "$slug" || true; done < "${{ runner.temp }}/new_slugs.txt"
